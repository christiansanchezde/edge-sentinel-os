<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Sentinel OS Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        
        <div class="left-column">
            
            <div class="top-bar">
                <div class="brand-title">EDGE SENTINEL OS</div>
                <div class="sys-info-badges" style="display: flex; gap: 15px; margin-left: auto; margin-right: 20px;">
                    <span class="status-indicator online" style="padding: 5px 10px; font-size: 0.8rem; margin: 0;" id="badge-fw">FW: Loading...</span>
                    <span class="status-indicator online" style="padding: 5px 10px; font-size: 0.8rem; margin: 0; background-color: rgba(56, 189, 248, 0.1); color: var(--hmi-accent-color); border-color: var(--hmi-accent-color);" id="badge-ai">AI: Loading...</span>
                </div>
                <button class="circular-btn" id="btnToggleConfig" title="Toggle Configuration Sidebar">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>

            <div class="main-display" id="mainDisplay">
                
                <div id="view-readouts" class="view-panel active">
                    <h2>Live Sensor Readouts</h2>
                    <div class="kpi-row">
                        <div class="kpi-card">
                            <div class="kpi-header"><span class="kpi-icon">🌡️</span><span class="kpi-title">CHAMBER TEMP</span></div>
                            <div class="kpi-value" id="val-temp">--.- °C</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-header"><span class="kpi-icon">💧</span><span class="kpi-title">HUMIDITY</span></div>
                            <div class="kpi-value" id="val-hum">--.- %</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-header"><span class="kpi-icon">🌪️</span><span class="kpi-title">PRESSURE</span></div>
                            <div class="kpi-value" id="val-pres">---- hPa</div>
                        </div>
                    </div>
                    <div class="chart-container"><canvas id="sensorChart"></canvas></div>
                </div>

                <div id="view-status" class="view-panel">
                    <h2>System Event Log</h2>
                    <div class="log-container" id="logOutput"></div>
                </div>
            </div>

            <div class="nav-bar">
                <div class="nav-page-container active" data-target="view-readouts">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Readouts</span>
                </div>
                <div class="nav-page-container" data-target="view-status">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">System Status</span>
                </div>
                
                </div>
        </div>

        <div class="right-column" id="configSidebar">
            <div class="sidebar-content">
                <h2>Configuration</h2>
                <div class="config-group">
                    <label>Theme Mode</label>
                    <select id="themeSelect" class="touch-select">
                        <option value="dark" selected>Dark (Slate)</option>
                        <option value="light">Light </option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Time Window</label>
                    <select id="timeWindowSelect" class="touch-select">
                        <option value="1">Last 1 Minute</option>
                        <option value="5" selected>Last 5 Minutes</option>
                        <option value="10">Last 10 Minutes</option>
                        <option value="60">Last 60 Minutes</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>System Status</label>
                    <div class="status-indicator online">NPU: ONLINE</div>
                    <div class="status-indicator online">I2C: ONLINE</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/models/api.js?v=2"></script>
    <script src="js/views/ui.js?v=2"></script>
    <script src="js/viewmodels/dashboard.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
</body>
</html>
